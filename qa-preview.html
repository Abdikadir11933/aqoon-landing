<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>AQOON responsive preview QA</title><style>body{font:14px system-ui;margin:12px;background:#ddd}form{display:flex;gap:12px;margin-bottom:12px}iframe{display:block;border:0;background:white}pre{white-space:pre-wrap;max-width:1250px}</style></head><body><form><label>Width <select name="width"><option>320</option><option selected>390</option><option>768</option><option>1280</option></select></label><label>Page <select name="page"><option value="/">Homepage</option><option value="/paketit">Services</option><option value="/tapaus">Case</option><option value="/menetelma">Method</option><option value="/meista">About</option><option value="/havainnot">Articles</option><option value="/havainnot/miten-somalinkielinen-yleiso-loytaa-palvelut">Analytics</option><option value="/caawi/xog">Family guidance</option></select></label><button>Show preview</button></form><iframe title="Responsive page preview" height="844"></iframe><pre id="results">Loading rendered frame</pre><script>
const params=new URLSearchParams(location.search),select=document.querySelector('[name=width]'),page=document.querySelector('[name=page]'),frame=document.querySelector('iframe');
if([...select.options].some(o=>o.value===params.get('width')))select.value=params.get('width');
if([...page.options].some(o=>o.value===params.get('page')))page.value=params.get('page');
frame.width=select.value;frame.src=page.value;
frame.addEventListener('load',async()=>{const doc=frame.contentDocument,win=frame.contentWindow;await doc.fonts.ready;const visible=el=>el.getBoundingClientRect().width>0;const rect=el=>{const r=el.getBoundingClientRect();return {top:r.top,bottom:r.bottom,width:r.width}};document.querySelector('#results').textContent=JSON.stringify({page:page.value,width:win.innerWidth,scrollWidth:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>win.innerWidth,heading:doc.querySelector('h1')?.textContent,primary:doc.querySelector('.home-hero__actions a')?rect(doc.querySelector('.home-hero__actions a')):null,columns:[...doc.querySelectorAll('.offer-summary,.phase-comparison')].map(el=>win.getComputedStyle(el).gridTemplateColumns),menu:doc.querySelector('[data-menu-toggle]')?visible(doc.querySelector('[data-menu-toggle]')):null,images:[...doc.images].map(el=>({src:el.getAttribute('src'),loaded:el.complete&&el.naturalWidth>0}))},null,2);});
</script></body></html>
