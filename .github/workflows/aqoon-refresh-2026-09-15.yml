name: AQOON verified opportunity refresh 2026-09-15
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/aqoon-refresh-2026-09-15.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified programme refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('caawi/ajankohtaiset/index.html')
          registry_path = Path('internal/open-programmes.md')
          html = html_path.read_text()
          registry = registry_path.read_text()

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected text for {label}: {old[:120]!r}')
              return text.replace(old, new, 1)

          def insert_before(text, anchor, addition, marker, label):
              if marker in text:
                  raise SystemExit(f'{label} already present unexpectedly')
              if anchor not in text:
                  raise SystemExit(f'Missing insertion anchor for {label}: {anchor[:120]!r}')
              return text.replace(anchor, addition + anchor, 1)

          html = rep(html, 'La xaqiijiyey 14.9.2026.', 'La xaqiijiyey 15.9.2026.', 'public verification date')

          html = rep(
              html,
              'Vantaa · fasallada 1–4 · fasaxa dayrta usbuuca 42 · 45 € / toddobaad · isdiiwaangelin 15.9. saacadda 8',
              'Vantaa · fasallada 1–4 · fasaxa dayrta usbuuca 42 · 45 € / toddobaad · isdiiwaangelintu waxay bilaabatay 15.9. saacadda 8',
              'Vantaa camp meta',
          )
          html = rep(
              html,
              'Isdiiwaangelintu waxay furmaysaa 15.9. saacadda 8.00, boosaskana waxaa lagu buuxiyaa sida loo kala horreeyo.',
              'Isdiiwaangelintu waxay bilaabatay 15.9. saacadda 8.00, boosaskana waxaa lagu buuxiyaa sida loo kala horreeyo. Ka hubi Vantaaliikunta in boos wali jiro ka hor intaadan ballan qaadin ama tegin.',
              'Vantaa camp registration status',
          )

          html = rep(
              html,
              'Espoo · 3.–9. luokkalaiset / 9–15 jir · Isniin · Finnish/English · bilaash · isdiiwaangelin · waqtiga hubi',
              'Espoo · 3.–9. luokkalaiset / 9–15 jir · Isniin kasta 16.30–18 · 7.9.2026–10.5.2027 · bilaash · isdiiwaangelin',
              'Tasty Snack meta',
          )
          html = rep(
              html,
              'Espoon harrastuspolku waxay Entressen kirjasto ku leedahay koox bilaash ah oo carruurta iyo dhalinyarada lagu sameeyo cunto fudud, snacks iyo cuntooyin sahlan. Bogga rasmiga ah ee dhacdada 14.9. wuxuu qorayaa 15–16.30, laakiin liiska Entressen kirjasto wuxuu isla maalintaas muujinayaa laba Tasty Snack: fasallada 3–6 saacadaha 15–16.30 iyo fasallada 3–9 saacadaha 16.30–18. Sidaa darteed waqtiga saxda ah ka xaqiiji bogga rasmiga ah ama isdiiwaangelinta ka hor intaadan tegin. Xogta la xaqiijiyey waa fasallada 3–9 / 9–15 jir, Finnish iyo English, bilaash iyo isdiiwaangelin; kooxaha harrastuspolku waxay socdaan sannad-dugsiyeedka marka laga reebo fasaxyada dugsiga.',
              'Espoon harrastuspolku waxay Entressen kirjasto ku leedahay koox bilaash ah oo carruurta iyo dhalinyarada lagu sameeyo cunto fudud, snacks iyo cuntooyin sahlan. Jadwalka hadda ee Espoo wuxuu kooxda 3.–9. luokkalaiset / 9–15 jir u xaqiijinayaa Isniin kasta 16.30–18, 7.9.2026–10.5.2027, marka laga reebo fasaxyada dugsiga; kulanka xiga waa 21.9. Luqadaha la sheegay waa Finnish iyo English. Isdiiwaangelin ayaa loo baahan yahay.',
              'Tasty Snack corrected series',
          )
          html = rep(html, 'espooevents%3Aagqfyuh7xi', 'espooevents%3Aagqfy2b5p4', 'Tasty Snack series URL')

          html = rep(
              html,
              'Helsinki · 18–29 jir · Finnish A2.1+ · kooxda xigta 15.9.–7.10.2026',
              'Helsinki · 18–29 jir · Finnish A2.1+ · kooxda 15.9.–7.10.2026',
              'Stadin Futura meta',
          )
          html = rep(
              html,
              'Kooxda xigta waxay socotaa 15.9.–7.10., Talaado iyo Arbaco 9–12, Teollisuuskatu.',
              'Kooxda hadda la daabacay waxay socotaa 15.9.–7.10., Talaado iyo Arbaco 9–12, Teollisuuskatu. Maadaama kooxdu 15.9. bilaabatay, vastuuasiantuntija-ka ka hubi in gelitaan dambe weli suurtagal yahay.',
              'Stadin Futura current status',
          )

          work_anchor = '<article class="card"><div class="meta urgent">Vantaa · codsigu ilaa 5.10.2026 · Finnish A2.2 · bilaabma 2.11.</div><h3>Rakennusalan työvoimakoulutus</h3>'
          new_work_cards = '''<article class="card"><div class="meta urgent">Helsinki · maahan muuttaneille · Finnish A1.3 · codsigu ilaa 11.10.2026 · waxbarashadu 7.1.–17.6.2027</div><h3>Hoivapolku maahan muuttaneille</h3><p>Stadin AO:n työvoimakoulutus-kan hadda furan waxaa loogu talagalay maahan muuttaneet, waxaana bogga rasmiga ahi sheegayaa heer Finnish A1.3. Codsigu wuxuu furan yahay ilaa 11.10.2026, waxbarashaduna 7.1.–17.6.2027. Työvoimakoulutus waxaa ugu horreyn loogu talagalay shaqo-la'aanta ama dadka halista ugu jira inay shaqo la'aan noqdaan.</p><a href="https://stadinao.hel.fi/hae-opiskelemaan/palvelut-tyollistymiseen-ja-opintoihin/tyovoimakoulutukset/">Stadin AO, rasmi ↗</a></article>\n<article class="card"><div class="meta urgent">Helsinki · maahan muuttaneille · Finnish A2.1 · codsigu ilaa 30.10.2026 · waxbarashadu 7.1.–28.5.2027</div><h3>Varastopolku maahan muuttaneille</h3><p>Stadin AO:n työvoimakoulutus-kan hadda furan waxaa loogu talagalay maahan muuttaneet, waxaana bogga rasmiga ahi sheegayaa heer Finnish A2.1. Codsigu wuxuu furan yahay ilaa 30.10.2026, waxbarashaduna 7.1.–28.5.2027. Työvoimakoulutus waxaa ugu horreyn loogu talagalay shaqo-la'aanta ama dadka halista ugu jira inay shaqo la'aan noqdaan.</p><a href="https://stadinao.hel.fi/hae-opiskelemaan/palvelut-tyollistymiseen-ja-opintoihin/tyovoimakoulutukset/">Stadin AO, rasmi ↗</a></article>\n'''
          html = insert_before(html, work_anchor, new_work_cards, '<h3>Hoivapolku maahan muuttaneille</h3>', 'new Stadin AO migrant routes')

          hobby_anchor = '<article class="card"><div class="meta urgent">Vantaa · 26.9.2026 · bilaash</div><h3>Kolibrí Festival</h3>'
          new_hobby_cards = '''<article class="card"><div class="meta urgent">Vantaa · 19.9.2026 saacadaha 12–15 · carruurta/dhalinyarada u baahan taageero gaar ah + qoysaskooda · bilaash</div><h3>Harrastushulinat – Vantaan Energia Areena</h3><p>Carruurta iyo dhalinyarada naafada ah ama u baahan taageero gaar ah, iyo qoysaskooda, waxay si bilaash ah u tijaabin karaan hiwaayado kala duwan jawi deggan oo taageero leh. Tijaabooyinka waxaa si gaar ah loogu talagalay 7 jir iyo ka weyn, khibrad ama xirfad horena looma baahna. Munaasabadda: Sabti 19.9. saacadaha 12–15, Vantaan Energia Areena.</p><a href="https://www.vantaa.fi/fi/ajankohtaista/uutinen/erityislasten-ja-nuorten-harrastushulinat-kutsuu-kokeilemaan-uusia-harrastuksia-vantaan-energia-areenalle">Vantaa, rasmi ↗</a></article>\n<article class="card"><div class="meta urgent">Helsinki · Caisa · 20.9.2026 saacadaha 11–17 · qoysaska · bilaash · isdiiwaangelin looma baahna</div><h3>Kolibrí Festival Family Day – Caisa</h3><p>Waa maalin qoys oo leh workshops farshaxan, muusig iyo ciyaar, sheekooyin luqado badan ah iyo carwo buugaag carruur. Waxay dhacaysaa Axad 20.9. saacadaha 11–17, Kulttuurikeskus Caisa, Kaikukatu 4. Gelitaanku waa bilaash, isdiiwaangelinna looma baahna.</p><a href="https://tapahtumat.hel.fi/en/events/kulke%3A68785">Helsinki, rasmi ↗</a></article>\n'''
          html = insert_before(html, hobby_anchor, new_hobby_cards, '<h3>Harrastushulinat – Vantaan Energia Areena</h3>', 'new family hobby events')

          registry = rep(registry, 'Last compiled: 14.9.2026', 'Last compiled: 15.9.2026', 'registry date')
          registry = rep(
              registry,
              '  - Status: registration opens Tuesday 15.9.2026 at 08.00 in Vantaaliikunta and places are filled in registration order. Camps are Finnish-language and cost €45/child/week, including possible excursion fees.',
              '  - Status: registration opened Tuesday 15.9.2026 at 08.00 in Vantaaliikunta and places are filled in registration order. Camps are Finnish-language and cost €45/child/week, including possible excursion fees. Re-check Vantaaliikunta before routing because the source does not guarantee that places remain available after opening.',
              'registry Vantaa camp status',
          )
          registry = rep(
              registry,
              '  - Status: registration is open until 15.9.2026 or until available places fill. The pilot runs during autumn 2026 and spring 2027 at the daycares currently listed by Vantaa. The volunteer can agree the frequency and duration with the daycare.',
              '  - Status: the published deadline is today, 15.9.2026, or earlier if available places fill; the source does not state a closing clock time, so re-check the form before routing. The pilot runs from September 2026 to June 2027 at the daycares currently listed by Vantaa. The volunteer can agree the frequency and duration with the daycare.',
              'Lukukamut deadline status',
          )
          registry = rep(
              registry,
              '  - Status: current school-year route at Entresse Library, Siltakatu 11. The official dated event page for 14.9 lists 15.00–16.30, while Entresse Library\'s current event list shows a separate grades 3–6 Tasty Snack at 15.00–16.30 and a grades 3–9 Tasty Snack at 16.30–18.00 on the same day. Treat the exact time as conflicting official data and re-check the event/registration before routing; do not state a single confirmed time until Espoo\'s pages align. Verified facts: grades 3–9 / age 9–15, Finnish and English, free, registration available, and hobby groups run through the school year except school holidays unless otherwise stated.',
              '  - Status: current series at Entresse Library, Siltakatu 11, 7.9.2026–10.5.2027, Mondays 16.30–18.00 except school holidays; the current Espoo listings now align on 16.30–18.00 for the grades 3–9 group. The next listed session is 21.9.2026. Free; registration is available.',
              'registry Tasty Snack status',
          )
          registry = rep(registry, 'https://www.espoo.fi/fi/tapahtumat/espooevents%3Aagqfyuh7xi', 'https://www.espoo.fi/fi/tapahtumat/espooevents%3Aagqfy2b5p4', 'registry Tasty URL')
          registry = rep(
              registry,
              '  - Status: next group 15.9.–7.10.2026, Tuesdays–Wednesdays 9–12 at Teollisuuskatu. Later groups are 13.10.–4.11. and 10.11.–2.12.2026. No separate public application deadline is stated on the checked page.',
              '  - Status: the published group 15.9.–7.10.2026 starts today and runs Tuesdays–Wednesdays 9–12 at Teollisuuskatu. Later groups are 13.10.–4.11. and 10.11.–2.12.2026. No separate public application deadline is stated; because entry is through the employment-services referral and initial interview, check with the responsible expert before promising late entry to a group that has already started.',
              'registry Stadin Futura status',
          )
          registry = rep(
              registry,
              '  - Status: the **Turvallisuusala + S2-tuki** route closed on 4.9.2026. The **Elintarvikealan avustaviin tehtäviin, kielituettu koulutus maahan muuttaneille** route is now **closed/passed**; its official application deadline was 7.9.2026 and the training period is 13.10.2026–18.6.2027. Do not present either route as open from 8.9. onward unless the official page changes. Stadin AO says future trainings will be added during autumn and application dates announced later.',
              '  - Status: the older **Turvallisuusala + S2-tuki** and **Elintarvikealan avustaviin tehtäviin** rounds are closed. Newly published open migrant routes are **Hoivapolku maahan muuttaneille (A1.3)** through 11.10.2026, training 7.1.–17.6.2027, and **Varastopolku maahan muuttaneille (A2.1)** through 30.10.2026, training 7.1.–28.5.2027. Do not infer additional eligibility beyond the official labour-market-training criteria and the published language levels.',
              'Stadin migrant training registry status',
          )

          training_anchor = '  - Official: https://stadinao.hel.fi/hae-opiskelemaan/palvelut-tyollistymiseen-ja-opintoihin/tyovoimakoulutukset/\n\n- **Sosiaali- ja terveysalan koulutus** — Stadin AO / Helsinki employment services'
          training_entries = '''  - Official: https://stadinao.hel.fi/hae-opiskelemaan/palvelut-tyollistymiseen-ja-opintoihin/tyovoimakoulutukset/\n\n- **Hoivapolku maahan muuttaneille** — Stadin AO\n  - Fits: immigrant jobseekers for whom labour-market training is appropriate; the published Finnish level is A1.3. Labour-market training is primarily for unemployed jobseekers or people at risk of unemployment.\n  - Helps with: an employment-oriented care-sector path with language level stated by the provider. Do not infer a guaranteed qualification or job outcome from the listing.\n  - Status: application open until 11.10.2026; training 7.1.–17.6.2027.\n  - Official: https://stadinao.hel.fi/hae-opiskelemaan/palvelut-tyollistymiseen-ja-opintoihin/tyovoimakoulutukset/\n\n- **Varastopolku maahan muuttaneille** — Stadin AO\n  - Fits: immigrant jobseekers for whom labour-market training is appropriate; the published Finnish level is A2.1. Labour-market training is primarily for unemployed jobseekers or people at risk of unemployment.\n  - Helps with: an employment-oriented warehouse/logistics path. Do not infer a guaranteed qualification or job outcome from the listing.\n  - Status: application open until 30.10.2026; training 7.1.–28.5.2027.\n  - Official: https://stadinao.hel.fi/hae-opiskelemaan/palvelut-tyollistymiseen-ja-opintoihin/tyovoimakoulutukset/\n\n- **Kosmetiikkamyynnin osaaja** — Stadin AO\n  - Fits: jobseekers for whom labour-market training is appropriate; the checked listing does not state a migrant-only target group or a language level, so do not add either claim.\n  - Helps with: employment-oriented cosmetics sales training.\n  - Status: application open until 11.11.2026; training 11.1.–16.6.2027.\n  - Official: https://stadinao.hel.fi/hae-opiskelemaan/palvelut-tyollistymiseen-ja-opintoihin/tyovoimakoulutukset/\n\n- **Sosiaali- ja terveysalan koulutus** — Stadin AO / Helsinki employment services'''
          if '**Hoivapolku maahan muuttaneille** — Stadin AO' in registry:
              raise SystemExit('Hoivapolku detailed registry entry already present unexpectedly')
          registry = rep(registry, training_anchor, training_entries, 'new Stadin AO registry entries')

          vantaa_kolibri_anchor = '- **Kolibrí Festival — Vantaa 26.9.2026** — Vantaan kaupunki / children\'s cultural services'
          harrastushulinat_entry = '''- **Harrastushulinat — Vantaan Energia Areena 19.9.2026** — Vantaan kaupunki\n  - Fits: children and young people with disabilities or special support needs, and their families; the hobby try-outs are especially suitable for age 7+.\n  - Helps with: low-threshold trials of sports and cultural hobbies in a supportive setting.\n  - Status: Saturday 19.9.2026, 12.00–15.00, Vantaan Energia Areena; free. No previous experience or skills are required.\n  - Official: https://www.vantaa.fi/fi/ajankohtaista/uutinen/erityislasten-ja-nuorten-harrastushulinat-kutsuu-kokeilemaan-uusia-harrastuksia-vantaan-energia-areenalle\n\n'''
          registry = insert_before(registry, vantaa_kolibri_anchor, harrastushulinat_entry, '**Harrastushulinat — Vantaan Energia Areena 19.9.2026**', 'Harrastushulinat registry entry')

          welcome_anchor = '- **Welcome Day — Kanneltalo 16.9.2026** — City of Helsinki'
          caisa_entry = '''- **Kolibrí Festival Family Day — Caisa 20.9.2026** — City of Helsinki / Kulttuurikeskus Ninho ry\n  - Fits: children and families looking for a free multilingual cultural day.\n  - Helps with: artistic workshops, music and dance, multilingual storytelling, a children\'s book fair and low-threshold family participation.\n  - Status: Sunday 20.9.2026, 11.00–17.00, Cultural Centre Caisa, Kaikukatu 4; free entry and no registration required.\n  - Official: https://tapahtumat.hel.fi/en/events/kulke%3A68785\n\n'''
          registry = insert_before(registry, welcome_anchor, caisa_entry, '**Kolibrí Festival Family Day — Caisa 20.9.2026**', 'Caisa Kolibri registry entry')

          registry = rep(
              registry,
              '  - Event: 28.–29.10.2026 at Clarion Hotel Helsinki Airport; registration window is listed as 31.8.–14.9.2026.',
              '  - Event: 28.–29.10.2026 at Clarion Hotel Helsinki Airport. The published remote-registration and in-person application window 31.8.–14.9.2026 is now closed/passed; in-person confirmations or waiting-list notices are expected 15.–17.9.2026.',
              'Integration 2026 partner status',
          )

          html_path.write_text(html)
          registry_path.write_text(registry)
          PY
      - name: Guard scope and Pilke
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = $'caawi/ajankohtaiset/index.html\ninternal/open-programmes.md'
          ! git diff --name-only | grep -q '^pilke/'
      - name: Run focused repository checks
        run: |
          python scripts/repo_integrity_qa.py
          python scripts/site_qa.py
          python scripts/somali_language_qa.py
      - name: Commit verified refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add caawi/ajankohtaiset/index.html internal/open-programmes.md
          git diff --cached --check
          git commit -m 'daily: refresh verified AQOON opportunities for 15.9.2026'
          git push origin HEAD:master
