name: AQOON site QA
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified 18 September AQOON updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          page_path = Path('caawi/ajankohtaiset/index.html')
          page = page_path.read_text(encoding='utf-8')
          page = replace_once(page, '<strong>La xaqiijiyey 17.9.2026.</strong>', '<strong>La xaqiijiyey 18.9.2026.</strong>', 'public verification date')

          minecraft_card = '''<article class="card"><div class="meta urgent">Espoo · Entressen kirjasto · 9–12 jir / 3.–6. luokkalaiset · Jimce kasta 15–16 ama 16–17 · ilaa 14.5.2027 · Finnish/English · bilaash · isdiiwaangelin</div><h3>Minecraft seikkailijat – Espoon harrastuspolku</h3><p>Entressen kirjasto Kibe waxaa ka socda laba kooxood oo Minecraft ah carruurta 9–12 jir: Jimce kasta 15–16 iyo 16–17. Taxanaha hadda jira wuxuu socdaa 11.9.2026–14.5.2027, mana kulmo fasaxyada dugsiga. Finnish iyo English ayaa la isticmaalaa, ka qaybgalka waa bilaash, isdiiwaangelinna waa loo baahan yahay. Bogga rasmiga ahi wuxuu sheegayaa in carruurta la soo dhoweynayo iyadoon loo eegin aqoonta luqadda, toimintakyky ama khibrad hore; baahida taageerada waxaa lagu sheegi karaa marka la isdiiwaangelinayo.</p><a href="https://www.espoo.fi/en/events/espooevents%3Aagqgv7vgvi">Espoo, kooxda 15–16 ↗</a> · <a href="https://www.espoo.fi/fi/tapahtumat/espooevents%3Aagqgwbzwni">Espoo, kooxda 16–17 ↗</a></article>'''
          hobby_anchor = '<article class="card"><div class="meta urgent">Espoo · Entressen kirjasto · 10–15 jir · Khamiis kasta 17–18.30 · English · bilaash</div><h3>Pingpong for youth</h3>'
          if 'Minecraft seikkailijat – Espoon harrastuspolku' not in page:
              page = replace_once(page, hobby_anchor, minecraft_card + '\n' + hobby_anchor, 'Minecraft public anchor')

          baby_card = '''<article class="card"><div class="meta urgent">Espoo · Lippulaivan kirjasto · 25.9.2026 saacadaha 10–12 · qoysaska dhallaanka iyo carruurta yaryar · bilaash</div><h3>Vauvan päivä Lippulaivan kirjastossa</h3><p>Qoysaska carruurta leh waxaa 25.9. Lippulaivan kirjastossa loogu qabanayaa Vauvan päivä bilaash ah. Barnaamijka waxaa ku jira riwaayado ku habboon dhallaanka iyo carruurta waaweyn, valokylpy iyo runokylpylä, sidoo kale talooyin ku saabsan waxqabadyo hal-abuur leh oo guriga iyo adeegyada dhaqanka ee magaalada laga heli karo. Goobta waa Espoonlahdenkatu 8. Bogga rasmiga ahi wuxuu dhacdada ku sheegay ikärajaton iyo vapaa pääsy; ma daabicin shuruud isdiiwaangelin oo gaar ah, sidaas darteed AQOON ma ballanqaadayso mid.</p><a href="https://www.espoo.fi/en/events/espooevents%3Aagp76j6oeu">Espoo, rasmi ↗</a></article>'''
          parent_anchor = '<article class="card"><div class="meta">Helsinki · Kannelmäki, Malmi & Mellunkylä · dayrta 2026</div><h3>Tervetuloa perheet (Welcome Families)</h3>'
          if 'Vauvan päivä Lippulaivan kirjastossa' not in page:
              page = replace_once(page, parent_anchor, baby_card + '\n' + parent_anchor, 'Vauvan päivä public anchor')

          page_path.write_text(page, encoding='utf-8')

          registry_path = Path('internal/open-programmes.md')
          registry = registry_path.read_text(encoding='utf-8')
          registry = replace_once(registry, 'Last compiled: 17.9.2026', 'Last compiled: 18.9.2026', 'registry compile date')

          minecraft_registry = '''- **Minecraft seikkailijat — Entresse Library / Espoo Hobby Path** — City of Espoo / Xroc
  - Fits: children aged 9–12 / grades 3–6; the official listings state Finnish and English.
  - Helps with: a free weekly gaming hobby built around cooperative Minecraft play. The organiser says children are welcome regardless of language skills, functional capacity or prior hobby background; support needs can be shared during registration.
  - Status: two Friday groups at Entresse Library Kibe, Siltakatu 11: 15.00–16.00 and 16.00–17.00. The published series runs 11.9.2026–14.5.2027 and does not meet during school holidays. Free; registration is required through the official event/sign-up route.
  - Official 15–16 group: https://www.espoo.fi/en/events/espooevents%3Aagqgv7vgvi
  - Official 16–17 group: https://www.espoo.fi/fi/tapahtumat/espooevents%3Aagqgwbzwni
  - Checked: 18.9.2026.

'''
          registry_anchor = '- **Pingpong for youth — Entresse Library** — City of Espoo\n'
          if '**Minecraft seikkailijat — Entresse Library / Espoo Hobby Path**' not in registry:
              registry = replace_once(registry, registry_anchor, minecraft_registry + registry_anchor, 'Minecraft registry anchor')

          baby_registry = '''- **Vauvan päivä Lippulaivan kirjastossa — 25.9.2026** — CultureEspoo / City of Espoo
  - Fits: families with babies and small children; the official listing marks the event as all-ages.
  - Helps with: free family cultural participation, including baby/toddler-suitable concerts, a light bath, a poetry spa and ideas for creative activities at home and through Espoo cultural services.
  - Status: Friday 25.9.2026, 10.00–12.00, Lippulaiva Library, Espoonlahdenkatu 8; free entry. The checked primary source does not state a separate advance-registration requirement, so do not invent one; re-check the event page before routing close to the date.
  - Official: https://www.espoo.fi/en/events/espooevents%3Aagp76j6oeu
  - Checked: 18.9.2026.

'''
          family_anchor = '- **Workshop for Families — Entresse Library** — City of Espoo\n'
          if '**Vauvan päivä Lippulaivan kirjastossa — 25.9.2026**' not in registry:
              registry = replace_once(registry, family_anchor, baby_registry + family_anchor, 'Vauvan päivä registry anchor')

          registry_path.write_text(registry, encoding='utf-8')
          PY
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'caawi/ajankohtaiset/index.html\ninternal/open-programmes.md'
          ! printf '%s\n' "$changed" | grep -qi pilke
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add caawi/ajankohtaiset/index.html internal/open-programmes.md
          git commit -m 'Update verified AQOON opportunities for 18 Sep'
          git push origin HEAD:master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check repository context, skills and file integrity
        run: |
          python scripts/context_qa.py
          python scripts/repo_integrity_qa.py
      - name: Check tracker and Supabase collection contract
        run: node scripts/tracker_collection_qa.js
      - name: Run complete code and system regression suite
        run: node --test tests/*.test.js
      - name: Check routes, sitemap and architecture guards
        run: python scripts/site_qa.py
      - name: Check static SEO metadata
        run: python scripts/check_seo_metadata.py
      - name: Check mobile usability and accessibility guards
        run: python scripts/usability_qa.py
      - name: Check legal, independence and privacy guards
        run: python scripts/legal_trust_qa.py
      - name: Check tracker core JavaScript syntax
        run: node --check tracker/app.js && node --check tracker/interview-contract.js && node --check tracker/visual-v3.js && node --check tracker/crm-reactive.js && node --check tracker/operations-system.js && node --check tracker/interview-smart-notes.js && node --check tracker/incomplete-intake.js && node --check tracker/interview-follow-up-recap.js && node --check tracker/interview-next-steps.js
      - name: Check tracker adapters, matching and scenario learning syntax
        run: node --check tracker/multineed-adapter.js && node --check tracker/interview-match.js && node --check tracker/interview-match-preview.js && node --check tracker/scenario-learning.js && node --check tracker/interview-form-enhancements.js && node --check tracker/interview-context.js && node --check tracker/crm-call-history.js && node --check tracker/crm-queue-navigation.js
      - name: Check tracker evidence, CRM management and identity syntax
        run: node --check tracker/universal-proof-questions.js && node --check tracker/human-labels.js && node --check tracker/analytics-mobile-v2.js && node --check tracker/call-outcomes.js && node --check tracker/crm-manage.js && node --check tracker/operator-identity.js && node --check tracker/case-lifecycle.js && node --check tracker/interview-answers-restore.js
      - name: Check active interview and follow-up workflow layers
        run: node --check tracker/interview-ux-v4.js && node --check tracker/followup-workflow-v2.js && node --check tracker/followup-panel-v2.js && node --check tracker/followup-plan-confirm-v1.js && node --check tracker/phase-controls-v1.js
      - name: Check public site JavaScript syntax
        run: node --check assets/main.js && node --check assets/site.js && node --check caawi/app.js
      - name: Run caawi regression tests
        run: node --test tests/caawi.test.js
      - name: Run call outcome regression tests
        run: node --test tests/call-outcomes.test.js
