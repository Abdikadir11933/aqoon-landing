name: AQOON site QA
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check routes, sitemap and architecture guards
        run: python scripts/site_qa.py
      - name: Check tracker JavaScript syntax
        run: node --check tracker/app.js
