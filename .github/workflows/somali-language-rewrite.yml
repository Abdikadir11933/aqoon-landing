name: Apply Somali language rewrite
on:
  push:
    branches: [master]
    paths:
      - 'scripts/somali_language_rewrite.py'
      - '.github/workflows/somali-language-rewrite.yml'
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite Somali-facing copy
        run: python scripts/somali_language_rewrite.py
      - name: Commit rewritten copy
        run: |
          if git diff --quiet; then
            echo "No copy changes needed"
            exit 0
          fi
          git config user.name "AQOON language QA"
          git config user.email "actions@users.noreply.github.com"
          git add caawi so
          git commit -m "Polish Somali copy across family-facing pages"
          git push
