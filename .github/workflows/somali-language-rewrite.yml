name: Apply AQOON 18 Sep refresh
on:
  push:
    branches: [master]
    paths:
      - 'scripts/tmp_aqoon_refresh_2026_09_18.py'
      - '.github/workflows/somali-language-rewrite.yml'
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified programme refresh
        run: python scripts/tmp_aqoon_refresh_2026_09_18.py
      - name: Validate scope and commit refresh
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'caawi/ajankohtaiset/index.html\ninternal/open-programmes.md'
          if printf '%s\n' "$changed" | grep -qi pilke; then
            echo "Pilke scope violation" >&2
            exit 1
          fi
          git config user.name "AQOON programme refresh"
          git config user.email "actions@users.noreply.github.com"
          git add caawi/ajankohtaiset/index.html internal/open-programmes.md
          git commit -m "Update verified AQOON opportunities for 18 Sep"
          git push
