name: AQOON verified programme refresh 2026-09-13
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aqoon-programme-refresh-2026-09-13.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified 13 September programme updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          changes = [
              ('caawi/ajankohtaiset/index.html', 'PGRpdiBjbGFzcz0ibm90ZSI+PHN0cm9uZz5MYSB4YXFpaWppeWV5IDEyLjkuMjAyNi48L3N0cm9uZz4=', 'PGRpdiBjbGFzcz0ibm90ZSI+PHN0cm9uZz5MYSB4YXFpaWppeWV5IDEzLjkuMjAyNi48L3N0cm9uZz4=', 'public verification date'),
              ('caawi/ajankohtaiset/index.html', '', '', 'public youth cards'),
              ('caawi/ajankohtaiset/index.html', '', '', 'public family hobby cards'),
              ('internal/open-programmes.md', 'TGFzdCBjb21waWxlZDogMTIuOS4yMDI2', 'TGFzdCBjb21waWxlZDogMTMuOS4yMDI2', 'registry compiled date'),
              ('internal/open-programmes.md', 'LSAqKk11biBzdXVubmF0LCBtdW4gcG9sdXQqKiDigJQgT2hqYWFtbyBIZWxzaW5raQogIC0gRml0czogYWdlcyAxNeKAkzI5IHdobyBkbyBub3Qga25vdyB0aGVpciBzdHVkeS93b3JrIGRpcmVjdGlvbi4KICAtIFN0YXJ0czogMTQuOS4yMDI2LgogIC0gT2ZmaWNpYWw6IGh0dHBzOi8vbnVvcnRlbi5oZWwuZmkvdGFwYWh0dW1hLz9ldmVudF9pZD1oZWxzaW5raSUzQWFncHIyaXJ4c2k=', '', 'registry Helsinki youth entries'),
              ('internal/open-programmes.md', '', '', 'registry Espoo family entries'),
          ]
          for path, old_b64, new_b64, label in changes:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              old = base64.b64decode(old_b64).decode('utf-8')
              new = base64.b64decode(new_b64).decode('utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/aqoon-programme-refresh-2026-09-13.yml
          python - <<'PY'
          import subprocess
          allowed = {'caawi/ajankohtaiset/index.html', 'internal/open-programmes.md', '.github/workflows/aqoon-programme-refresh-2026-09-13.yml'}
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          changed = set()
          for line in out.splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected paths changed: {sorted(unexpected)}')
          if not {'caawi/ajankohtaiset/index.html', 'internal/open-programmes.md'} <= changed:
              raise SystemExit(f'Expected content files not both changed: {sorted(changed)}')
          if any('pilke' in p.lower() for p in changed):
              raise SystemExit('Pilke path changed unexpectedly')
          PY
      - name: Run repository and site QA on final working tree
        shell: bash
        run: |
          python scripts/context_qa.py
          python scripts/repo_integrity_qa.py
          node scripts/tracker_collection_qa.js
          node --test tests/*.test.js
          python scripts/site_qa.py
          python scripts/check_seo_metadata.py
          python scripts/usability_qa.py
          python scripts/legal_trust_qa.py
          node --check tracker/app.js && node --check tracker/interview-contract.js && node --check tracker/visual-v3.js && node --check tracker/crm-reactive.js && node --check tracker/operations-system.js && node --check tracker/interview-smart-notes.js && node --check tracker/incomplete-intake.js && node --check tracker/interview-follow-up-recap.js && node --check tracker/interview-next-steps.js
          node --check tracker/multineed-adapter.js && node --check tracker/interview-match.js && node --check tracker/interview-match-preview.js && node --check tracker/scenario-learning.js && node --check tracker/interview-form-enhancements.js && node --check tracker/interview-context.js && node --check tracker/crm-call-history.js && node --check tracker/crm-queue-navigation.js
          node --check tracker/universal-proof-questions.js && node --check tracker/human-labels.js && node --check tracker/analytics-mobile-v2.js && node --check tracker/call-outcomes.js && node --check tracker/crm-manage.js && node --check tracker/operator-identity.js && node --check tracker/case-lifecycle.js && node --check tracker/interview-answers-restore.js
          node --check tracker/interview-ux-v4.js && node --check tracker/followup-workflow-v2.js && node --check tracker/followup-panel-v2.js && node --check tracker/followup-plan-confirm-v1.js && node --check tracker/phase-controls-v1.js
          node --check assets/main.js && node --check assets/site.js && node --check caawi/app.js
          node --test tests/caawi.test.js
          node --test tests/call-outcomes.test.js
          python scripts/somali_language_qa.py
          git diff --check
      - name: Commit verified updates
        shell: bash
        run: |
          git config user.name "AQOON programme updater"
          git config user.email "actions@users.noreply.github.com"
          git add caawi/ajankohtaiset/index.html internal/open-programmes.md
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "programmes: refresh verified opportunities for 13 Sep"
          git push origin HEAD:master
