name: Apply Somali language rewrite pass 2
on:
  push:
    branches: [master]
    paths:
      - 'scripts/somali_language_rewrite_pass2.py'
      - '.github/workflows/somali-language-rewrite-pass2.yml'
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply second Somali cleanup
        run: python scripts/somali_language_rewrite_pass2.py
      - name: Commit rewritten copy
        run: |
          if git diff --quiet; then
            echo "No copy changes needed"
            exit 0
          fi
          git config user.name "AQOON language QA"
          git config user.email "actions@users.noreply.github.com"
          git add caawi
          git commit -m "Finish Somali language cleanup on deeper pages"
          git push
