name: AQOON status correction 2026-09-17
on:
  push:
    paths:
      - '.github/workflows/aqoon-status-fix-2026-09-17.yml'
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct started youth entrepreneurship course and registry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          public_path = Path('caawi/ajankohtaiset/index.html')
          registry_path = Path('internal/open-programmes.md')
          public = public_path.read_text(encoding='utf-8')
          registry = registry_path.read_text(encoding='utf-8')

          new_card = '<article class="card"><div class="meta urgent">Helsinki · ka yar 30 sano · bilaash · kooxda xigta 21., 22., 28. & 29.10.2026</div><h3>Aloittavan yrittäjän valmennus nuorille – lokakuu</h3><p>Kooxdii Sebtembar waxay bilaabatay 16.9., sidaas darteed hadda looma soo bandhigayo sidii bilow cusub. Kooxda xigta ee rasmiga ah waa afar galabood: 21.10., 22.10., 28.10. iyo 29.10. saacadaha 13–16, Helsingin työllisyyspalvelut, Malminkatu 34. Waxaa loogu talagalay dadka Helsinki jooga ee ka yar 30 sano ee ka fikiraya yrittäjyys ama bilaabaya ganacsi, xaalad kasta oo nololeedna way ku habboon tahay. Valmennus-ku waa bilaash oo Finnish ayaa lagu qabtaa. Bogga rasmiga ahi hadda wuxuu leeyahay link isdiiwaangelin; ka hubi booska ka hor intaadan ballan qaadin.</p><a href="https://nuorten.hel.fi/tapahtuma/?event_id=helsinki%3Aagqkhr56iy">Helsinki, rasmi & isdiiwaangelin ↗</a></article>'
          pattern = r'<article class="card"><div class="meta urgent">Helsinki · ka yar 30 sano · bilaash · 16\., 17\., 23\. & 24\.9\.</div><h3>Aloittavan yrittäjän valmennus nuorille</h3>.*?</article>'
          public, n = re.subn(pattern, new_card, public, count=1)
          if n != 1:
              raise SystemExit(f'public entrepreneurship card: expected one match, found {n}')

          entry = (
              '- **Aloittavan yrittäjän valmennus nuorille — October 2026** — Helsinki Employment Services / Ohjaamo Helsinki\n'
              '  - Fits: Helsinki residents under 30 who are considering entrepreneurship or starting a business; the official page says the course is open regardless of whether the person is unemployed, employed or a student. The course is in Finnish.\n'
              '  - Helps with: clarifying a business idea, drafting an initial business plan and calculations, and understanding basics such as taxation, company forms and start-up grant.\n'
              '  - Status: the September four-afternoon course started 16.9.2026, so do not route it as a fresh start from 17.9 onward. The next published course is 21.10., 22.10., 28.10. and 29.10.2026, 13.00–16.00, at Helsinki Employment Services, Malminkatu 34; free. The official page currently provides a registration link; re-check capacity before promising a place.\n'
              '  - Official: https://nuorten.hel.fi/tapahtuma/?event_id=helsinki%3Aagqkhr56iy\n'
              '  - Checked: 17.9.2026.\n\n'
          )
          anchor = '### Helsinki\n\n- **Ohjaamo Helsinki** — Helsingin kaupunki\n'
          if 'Aloittavan yrittäjän valmennus nuorille — October 2026' in registry:
              raise SystemExit('registry entrepreneurship entry already exists unexpectedly')
          if registry.count(anchor) != 1:
              raise SystemExit(f'registry Helsinki anchor: expected one match, found {registry.count(anchor)}')
          registry = registry.replace(anchor, '### Helsinki\n\n' + entry + '- **Ohjaamo Helsinki** — Helsingin kaupunki\n', 1)

          public_path.write_text(public, encoding='utf-8')
          registry_path.write_text(registry, encoding='utf-8')
          PY
          git diff --check
          git diff -- caawi/ajankohtaiset/index.html internal/open-programmes.md
      - name: Run relevant QA before commit
        run: |
          python scripts/context_qa.py
          python scripts/repo_integrity_qa.py
          node scripts/tracker_collection_qa.js
          node --test tests/*.test.js
          python scripts/site_qa.py
          python scripts/check_seo_metadata.py
          python scripts/usability_qa.py
          python scripts/legal_trust_qa.py
          node --check assets/main.js
          node --check assets/site.js
          node --check caawi/app.js
          node --test tests/caawi.test.js
          node --test tests/call-outcomes.test.js
          python scripts/somali_language_qa.py
      - name: Commit correction and remove helper
        shell: bash
        run: |
          rm .github/workflows/aqoon-status-fix-2026-09-17.yml
          git add caawi/ajankohtaiset/index.html internal/open-programmes.md .github/workflows/aqoon-status-fix-2026-09-17.yml
          git diff --cached --check
          git config user.name 'AQOON programme verifier'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'content: correct active programme status for 2026-09-17'
          git push origin HEAD:master
      - name: Dispatch canonical QA on final master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run site-qa.yml --ref master
          gh workflow run somali-language-qa.yml --ref master
# trigger
