name: AQOON content refresh 2026-09-14
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aqoon-content-refresh-20260914.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified 14 September opportunity refresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          changes = [
              ('caawi/ajankohtaiset/index.html', 'PGRpdiBjbGFzcz0ibm90ZSI+PHN0cm9uZz5MYSB4YXFpaWppeWV5IDEzLjkuMjAyNi48L3N0cm9uZz4=', 'PGRpdiBjbGFzcz0ibm90ZSI+PHN0cm9uZz5MYSB4YXFpaWppeWV5IDE0LjkuMjAyNi48L3N0cm9uZz4=', 'public verification date'),
              ('caawi/ajankohtaiset/index.html', '', '', 'Töpinät recurring series'),
              ('caawi/ajankohtaiset/index.html', '', '', 'Leppis transition and Tasty Snack'),
              ('internal/open-programmes.md', 'TGFzdCBjb21waWxlZDogMTMuOS4yMDI2', 'TGFzdCBjb21waWxlZDogMTQuOS4yMDI2', 'registry compiled date'),
              ('internal/open-programmes.md', '', '', 'registry Töpinät series'),
              ('internal/open-programmes.md', '', '', 'registry Leppis and Tasty Snack'),
          ]
          for path_s, old64, new64, label in changes:
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              old = base64.b64decode(old64).decode('utf-8')
              new = base64.b64decode(new64).decode('utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source block, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python - <<'PY'
          import subprocess
          allowed = {'caawi/ajankohtaiset/index.html', 'internal/open-programmes.md'}
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          changed = {line[3:] for line in out.splitlines()}
          if changed != allowed:
              raise SystemExit(f'Unexpected changed files: {sorted(changed)}')
          if any('pilke' in p.lower() for p in changed):
              raise SystemExit('Pilke path changed unexpectedly')
          PY
          git diff --check
      - name: Run relevant QA
        run: |
          python scripts/context_qa.py
          python scripts/repo_integrity_qa.py
          node --test tests/*.test.js
          python scripts/site_qa.py
          python scripts/check_seo_metadata.py
          python scripts/usability_qa.py
          python scripts/legal_trust_qa.py
          python scripts/somali_language_qa.py
      - name: Commit verified content refresh
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add caawi/ajankohtaiset/index.html internal/open-programmes.md
          git commit -m 'AQOON: refresh verified opportunities for 14 Sep'
          git push origin HEAD:master
