name: AQOON verified programme refresh 2026-09-13 v3
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aqoon-programme-refresh-2026-09-13-v3.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final verified family opportunity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          changes = [
            ('caawi/ajankohtaiset/index.html','','','public hobby insertion'),
            ('internal/open-programmes.md','LSAqKktva28gcGVyaGVlbiBMZXBwaXMgcG9wLXVwICsgTGVwcGlzIGtlcmhvdCoqIOKAlCBDaXR5IG9mIEVzcG9vIC8gTUFPTA==','','registry hobby insertion'),
          ]
          for path, old64, new64, label in changes:
              p=Path(path); text=p.read_text(encoding='utf-8')
              old=base64.b64decode(old64).decode('utf-8'); new=base64.b64decode(new64).decode('utf-8')
              if text.count(old)!=1: raise SystemExit(f'{label}: anchor count {text.count(old)}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git rm .github/workflows/aqoon-programme-refresh-2026-09-13-v3.yml
          python - <<'PY'
          import subprocess
          out=subprocess.check_output(['git','status','--porcelain'],text=True)
          changed={line[3:].split(' -> ')[-1] for line in out.splitlines()}
          allowed={'caawi/ajankohtaiset/index.html','internal/open-programmes.md','.github/workflows/aqoon-programme-refresh-2026-09-13-v3.yml'}
          if changed-allowed: raise SystemExit(f'unexpected changes: {changed-allowed}')
          if any('pilke' in p.lower() for p in changed): raise SystemExit('Pilke path changed')
          PY
      - name: Run relevant QA
        shell: bash
        run: |
          python scripts/context_qa.py
          python scripts/repo_integrity_qa.py
          node scripts/tracker_collection_qa.js
          node --test tests/*.test.js
          python scripts/site_qa.py
          python scripts/check_seo_metadata.py
          python scripts/usability_qa.py
          python scripts/legal_trust_qa.py
          node --check assets/main.js && node --check assets/site.js && node --check caawi/app.js
          node --test tests/caawi.test.js
          node --test tests/call-outcomes.test.js
          python scripts/somali_language_qa.py
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "AQOON programme updater"
          git config user.email "actions@users.noreply.github.com"
          git add caawi/ajankohtaiset/index.html internal/open-programmes.md
          git diff --cached --check
          git commit -m "programmes: add verified Töpinät family activity"
          git push origin HEAD:master
