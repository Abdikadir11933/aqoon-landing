name: AQOON temporary update

on:
  push:
    branches: [ master ]
    paths:
      - internal/tmp_apply_20260921.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'Abdikadir11933' || github.actor == 'openaiprod-github-ur'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Apply verified content update
        run: python internal/tmp_apply_20260921.py
      - name: Guard change boundary
        shell: bash
        run: |
          rm internal/tmp_apply_20260921.py
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qi 'pilke'; then
            echo 'Pilke change detected; refusing to commit.' >&2
            exit 1
          fi
          bad="$(printf '%s\n' "$changed" | grep -vE '^(caawi/ajankohtaiset/index.html|internal/open-programmes.md|internal/tmp_apply_20260921.py)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected changed paths: $bad" >&2
            exit 1
          fi
      - name: Commit verified programme refresh
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply verified 21 Sep 2026 AQOON programme refresh"
          git push
