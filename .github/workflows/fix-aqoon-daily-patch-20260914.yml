name: Repair AQOON one-run refresh
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-aqoon-daily-patch-20260914.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/aqoon-daily-patch-20260914.yml')
          s = p.read_text(encoding='utf-8')
          old = "git add caawi/ajankohtaiset/index.html internal/open-programmes.md .github/workflows/aqoon-daily-patch-20260914.yml"
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'git add -A', 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-aqoon-daily-patch-20260914.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: allow one-run AQOON refresh to remove itself'
          git push origin HEAD:master
