name: AQOON verified opportunity refresh 2026-09-16
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/aqoon-refresh-2026-09-16.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified programme refresh
        run: python3 scripts/temp_refresh_20260916.py
      - name: Commit verified refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caawi/ajankohtaiset/index.html internal/open-programmes.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "chore: refresh verified opportunities for 2026-09-16"
          git push origin HEAD:master
# retry after exact registry-match correction
