name: AQOON verified programme refresh 2026-09-20

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/aqoon-daily-update-20260920.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply verified programme updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          public = Path('caawi/ajankohtaiset/index.html')
          registry = Path('internal/open-programmes.md')

          text = public.read_text(encoding='utf-8')
          old = '<div class="note"><strong>La xaqiijiyey 18.9.2026.</strong>'
          new = '<div class="note"><strong>La xaqiijiyey 20.9.2026.</strong>'
          assert text.count(old) == 1, f'public verification marker count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = '''<article class="card"><div class="meta urgent">Vantaa · 19.9.2026 saacadaha 12–15 · carruurta/dhalinyarada u baahan taageero gaar ah + qoysaskooda · bilaash</div><h3>Harrastushulinat – Vantaan Energia Areena</h3><p>Carruurta iyo dhalinyarada naafada ah ama u baahan taageero gaar ah, iyo qoysaskooda, waxay si bilaash ah u tijaabin karaan hiwaayado kala duwan jawi deggan oo taageero leh. Tijaabooyinka waxaa si gaar ah loogu talagalay 7 jir iyo ka weyn, khibrad ama xirfad horena looma baahna. Munaasabadda: Sabti 19.9. saacadaha 12–15, Vantaan Energia Areena.</p><a href="https://www.vantaa.fi/fi/ajankohtaista/uutinen/erityislasten-ja-nuorten-harrastushulinat-kutsuu-kokeilemaan-uusia-harrastuksia-vantaan-energia-areenalle">Vantaa, rasmi ↗</a></article>'''
          new = '''<article class="card"><div class="meta urgent">Espoo · 7–17 jir · Axad kasta 14.15–15.15 · 6.9.2026–25.4.2027 · bilaash · isdiiwaangelin</div><h3>Jumppi Easy Hockey – Matinkylä</h3><p>Kiekko-Espoo iyo Espoo waxay leeyihiin koox hockey oo bilaash ah carruurta iyo dhalinyarada 7–17 jir. Waxaa loogu talagalay qofka doonaya inuu hockey-ga ku ciyaaro jawi fudud oo madadaalo leh, tartan rasmi ahna aan ku jirin. Kooxdu waxay kulantaa Axad kasta 14.15–15.15, Matinkartanontie 9–11. Luqadaha la sheegay waa Finnish iyo English. Isdiiwaangelin ayaa loo baahan yahay.</p><a href="https://www.espoo.fi/en/events/espooevents%3Aagqd672yf4">Espoo, rasmi & isdiiwaangelin ↗</a></article>
<article class="card"><div class="meta urgent">Espoo · 7–17 jir · Axad kasta 15.45–16.45 · 6.9.2026–25.4.2027 · bilaash · isdiiwaangelin</div><h3>Jumppi Ringette – Matinkylä</h3><p>Kooxdan bilaashka ah waxaa loogu talagalay carruurta iyo dhalinyarada 7–17 jir ee doonaya inay ringette tijaabiyaan ama u ciyaaraan madadaalo ahaan iyada oo aan league games lagu jirin. Waxay kulantaa Axad kasta 15.45–16.45, Matinkartanontie 9–11. Luqadaha la sheegay waa Finnish iyo English. Isdiiwaangelin ayaa loo baahan yahay.</p><a href="https://www.espoo.fi/en/events/espooevents%3Aagqd4vh3ci">Espoo, rasmi & isdiiwaangelin ↗</a></article>
<article class="card"><div class="meta urgent">Espoo · gabdho 7–15 jir & haween 15+ · Axad kasta · ilaa 18.10.2026 · casharka bilaash · uimahallin sisäänpääsymaksu · isdiiwaangelin</div><h3>Uimakoulu gabdhaha iyo haweenka – Keski-Espoo</h3><p>Cetus ry iyo Espoo waxay qabtaan uimakoulu bilow ah oo loogu talagalay gabdhaha iyo haweenka aan dabaasha aqoon. Gabdhaha 7–15 jir casharkoodu waa Axad kasta 9.15–9.45, haweenka 15+ na 9.45–10.15, Keski-Espoon uimahalli, Kaivomestarinniitty 2. Taxanuhu wuxuu socdaa 6.9.–18.10.2026. Casharka laftiisu waa bilaash, laakiin gelitaanka uimahalli-ga waa lacag caadi ah. Finnish, easy Finnish iyo English ayaa la sheegay. Koox walba si gooni ah ayaa loo isdiiwaangeliyaa.</p><a href="https://www.espoo.fi/en/news/2026/08/beginner-swimming-schools-girls-and-women-and-women-only-gym-sessions-are-starting-september">Espoo, rasmi & isdiiwaangelin ↗</a></article>'''
          assert text.count(old) == 1, f'Harrastushulinat public block count={text.count(old)}'
          text = text.replace(old, new, 1)
          public.write_text(text, encoding='utf-8')

          text = registry.read_text(encoding='utf-8')
          old = 'Last compiled: 18.9.2026'
          new = 'Last compiled: 20.9.2026'
          assert text.count(old) == 1, f'registry compiled marker count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = 'Exhibitor applications are open until 18.9.2026 at 16.00.'
          new = 'Exhibitor applications are open until 25.9.2026 at 16.00.'
          assert text.count(old) == 1, f'Megarekry exhibitor deadline count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = '''- **Harrastushulinat — Vantaan Energia Areena 19.9.2026** — Vantaan kaupunki
  - Fits: children and young people with disabilities or special support needs, and their families; the hobby try-outs are especially suitable for age 7+.
  - Helps with: low-threshold trials of sports and cultural hobbies in a supportive setting.
  - Status: Saturday 19.9.2026, 12.00–15.00, Vantaan Energia Areena; free. No previous experience or skills are required.
  - Official: https://www.vantaa.fi/fi/ajankohtaista/uutinen/erityislasten-ja-nuorten-harrastushulinat-kutsuu-kokeilemaan-uusia-harrastuksia-vantaan-energia-areenalle'''
          new = '''- **Harrastushulinat — Vantaan Energia Areena 19.9.2026** — Vantaan kaupunki
  - Fits: children and young people with disabilities or special support needs, and their families; the hobby try-outs were especially suitable for age 7+.
  - Helps with: low-threshold trials of sports and cultural hobbies in a supportive setting.
  - Status: passed/closed — the one-day event took place Saturday 19.9.2026, 12.00–15.00. Do not route families to it as a current opportunity unless Vantaa publishes a new date.
  - Official: https://www.vantaa.fi/fi/ajankohtaista/uutinen/erityislasten-ja-nuorten-harrastushulinat-kutsuu-kokeilemaan-uusia-harrastuksia-vantaan-energia-areenalle
  - Checked: 20.9.2026.'''
          assert text.count(old) == 1, f'Harrastushulinat registry block count={text.count(old)}'
          text = text.replace(old, new, 1)

          marker = '''- **Minecraft seikkailijat — Entresse Library / Espoo Hobby Path** — City of Espoo / Xroc'''
          assert text.count(marker) == 1, f'Minecraft registry marker count={text.count(marker)}'
          addition = '''- **Jumppi Easy Hockey — Matinkylä** — City of Espoo / Kiekko-Espoo
  - Fits: children and young people aged 7–17; the official listing states Finnish and English.
  - Helps with: free, low-threshold ice hockey in a relaxed environment without competitive games; suitable for trying the sport and enjoying hockey recreationally.
  - Status: Sundays 14.15–15.15, 6.9.2026–25.4.2027, Matinkartanontie 9–11, Espoo; free. Registration is required through the official sign-up route. Re-check the dated listing before routing close to a school-holiday period.
  - Official: https://www.espoo.fi/en/events/espooevents%3Aagqd672yf4
  - Checked: 20.9.2026.

- **Jumppi Ringette — Matinkylä** — City of Espoo / Kiekko-Espoo
  - Fits: children and young people aged 7–17; the official listing states Finnish and English.
  - Helps with: free ringette for fun, trying the sport and getting acquainted with it without league games.
  - Status: Sundays 15.45–16.45, 6.9.2026–25.4.2027, Matinkartanontie 9–11, Espoo; free. Registration is required through the official sign-up route. Re-check the dated listing before routing close to a school-holiday period.
  - Official: https://www.espoo.fi/en/events/espooevents%3Aagqd4vh3ci
  - Checked: 20.9.2026.

- **Beginner Swimming schools for girls and women — Keski-Espoo swimming hall** — City of Espoo / Cetus ry
  - Fits: girls aged 7–15 and women aged 15+ who do not know how to swim; official languages include Finnish, easy Finnish and English.
  - Helps with: beginner swimming instruction during women-only hours, with an all-women setting for the swimming facilities during those hours.
  - Status: Sundays, 6.9.–18.10.2026, Keski-Espoo swimming hall, Kaivomestarinniitty 2. Girls 7–15: 09.15–09.45; women 15+: 09.45–10.15. Classes are free, but the normal swimming-hall entrance fee applies. Separate registration is required for the girls' and women's swimming schools.
  - Official: https://www.espoo.fi/en/news/2026/08/beginner-swimming-schools-girls-and-women-and-women-only-gym-sessions-are-starting-september
  - Checked: 20.9.2026.

'''
          text = text.replace(marker, addition + marker, 1)
          registry.write_text(text, encoding='utf-8')
          PY
      - name: Verify only intended files changed
        shell: bash
        run: |
          git diff --check
          test "$(git status --short | awk '{print $2}' | grep -v '^.github/workflows/aqoon-daily-update-20260920.yml$' | sort | tr '\n' ' ')" = "caawi/ajankohtaiset/index.html internal/open-programmes.md "
      - name: Commit verified update and remove one-run workflow
        shell: bash
        run: |
          rm .github/workflows/aqoon-daily-update-20260920.yml
          git config user.name "Abdikadir11933"
          git config user.email "ad0298@student.jamk.fi"
          git add caawi/ajankohtaiset/index.html internal/open-programmes.md .github/workflows/aqoon-daily-update-20260920.yml
          git commit -m "Update verified AQOON opportunities for 20 Sep"
          git push origin HEAD:master
