name: Apply final trust links
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/final-trust-links.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/final_trust_links.py
      - run: |
          git config user.name "AQOON trust QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tietosuoja/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align Finnish trust and privacy wording"
          git push
