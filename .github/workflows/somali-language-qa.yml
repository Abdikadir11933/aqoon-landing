name: Somali language QA
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report language review candidates
        run: python scripts/somali_language_qa.py
