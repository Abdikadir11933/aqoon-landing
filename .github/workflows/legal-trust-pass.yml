name: Apply legal trust pass
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/legal-trust-pass.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/legal_trust_pass.py
      - name: Commit changes
        run: |
          git config user.name "AQOON trust QA"
          git config user.email "actions@users.noreply.github.com"
          git add caawi so
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Tighten legal trust and privacy language"
          git push
